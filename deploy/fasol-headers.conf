# Защитные заголовки fasol.app. Подключается include-ом в каждом location с собственным add_header
# (nginx не наследует add_header уровня server в такие location).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
# CSP сначала в режиме наблюдения: нарушения видны в консоли, ничего не блокируется
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
