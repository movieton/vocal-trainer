# Боевой конфиг nginx (копия с сервера: /etc/nginx/sites-available/fasol.app.conf). Править здесь, выкладывать с nginx -t.
# fasol.app — тренажёр вокала «Распевка» (статика из app/dist). Открыт без пароля. HTTPS добавляет certbot.
server {
    server_name fasol.app;

    root /var/www/fasol.app;
    index index.html;

    gzip on;
    gzip_types text/css image/svg+xml application/javascript application/json application/manifest+json;

    include snippets/fasol-headers.conf;
    server_tokens off;

    # PWA: манифест с правильным типом, сервис-воркер и index.html всегда свежие
    location ~ \.webmanifest$ { default_type application/manifest+json; }
    location = /sw.js { include snippets/fasol-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /index.html { include snippets/fasol-headers.conf; add_header Cache-Control "no-cache" always; }
    # хэшированные файлы сборки можно кэшировать надолго
    location /assets/ { try_files $uri =404; include snippets/fasol-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    # картинки и шрифты: нет файла — честный 404, а не страница сайта (иначе она осядет в кэше картинок)
    location ~ ^/(img|avatars|brand)/ { try_files $uri =404; }
    location ~ ^/api/push/(subscribe|unsubscribe)$ { limit_req zone=fasol_push burst=5 nodelay; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location ~ ^/api/(login|register|reset/request|reset/confirm)$ { limit_req zone=fasol_auth burst=10 nodelay; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/ { limit_req zone=fasol_api burst=20 nodelay; client_max_body_size 2m; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location / { try_files $uri $uri/ /index.html; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fasol.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fasol.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fasol.app;

    ssl_certificate /etc/letsencrypt/live/fasol.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fasol.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    include snippets/fasol-headers.conf;
    server_tokens off;
    return 301 https://fasol.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name fasol.app;
    return 301 https://fasol.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.fasol.app;
    return 301 https://fasol.app$request_uri;
}