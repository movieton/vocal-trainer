# fasol.app — тренажёр вокала «Распевка» (статика из app/dist). Открыт без пароля. HTTPS добавляет certbot.
server {
    listen 80;
    listen [::]:80;
    server_name fasol.app www.fasol.app;

    root /var/www/fasol.app;
    index index.html;

    gzip on;
    gzip_types text/css image/svg+xml application/javascript application/json application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # PWA: манифест с правильным типом, сервис-воркер и index.html всегда свежие
    location ~ \.webmanifest$ { default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    # хэшированные файлы сборки можно кэшировать надолго
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location / { try_files $uri $uri/ /index.html; }
}
